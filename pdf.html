<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>File della Cartella</title>

<style>
/* ------------------ LAYOUT A DUE SEZIONI ------------------ */
body {
  margin: 0;
  padding: 0;
  background: black;
  color: white;
  font-family: Arial;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ------------------ BLOCCO ALTO (max 50% schermo) ------------------ */
#big-gallery {
  flex: 0 0 auto;
  max-height: 50vh;
  overflow: hidden;
  background: black;
  padding: 10px 0;
  border-bottom: 2px solid #222;
}

/* ------------------ BLOCCO BASSO (scrollabile) ------------------ */
#pdf-container {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 20px;
}

/* ------------------ SPACER FINALE ANDROID ------------------ */
#bottom-spacer {
  height: 120px;
  width: 100%;
  background: black;
}

/* ------------------ TITOLO ------------------ */
h1 {
  text-align: center;
  color: red;
  font-size: 26px;
  margin: 10px 0 15px 0;
}

/* ------------------ TORNA INDIETRO ------------------ */
.back-button {
    position: fixed;
    top: 15px;
    right: 15px;
    background-color: #0275d8;
    color: white;
    padding: 20px 28px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    font-size: 26px;
    z-index: 999;
}

/* ------------------ VIEWER ------------------ */
#viewer-container {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  height: calc(50vh - 180px);
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}

#big-image,
#big-video {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: none;
}

/* ------------------ FULLSCREEN BUTTON ------------------ */
#fullscreen-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 42px;
  cursor: pointer;
  z-index: 20;
}

/* ------------------ MUTE ICON ------------------ */
#mute-btn {
  font-size: 38px;
  cursor: pointer;
  margin-top: 5px;
  display: none;
  text-align: right;
  padding-right: 20px;
}

/* ------------------ FRECCE + PLAY (L4) ------------------ */
#command-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 60px;
  margin-top: 5px;
  font-size: 60px;
}

#command-row span {
  user-select: none;
  cursor: pointer;
}

#slideshow-btn {
  font-size: 80px;
  cursor: pointer;
  margin: 0;
}

/* ------------------ INDICATORE ------------------ */
#counter {
  margin-top: 5px;
  font-size: 20px;
  color: #ccc;
}

/* ------------------ SLIDER VELOCITÀ ------------------ */
#speed-control {
  margin-top: 5px;
  width: 50%;
}

/* ------------------ EFFETTO BOLLA ------------------ */
.bubble {
  animation: bubbleZoom 2s cubic-bezier(.34,1.56,.64,1) forwards;
}

@keyframes bubbleZoom {
  0%   { opacity: 0; transform: scale(0.3); }
  100% { opacity: 1; transform: scale(1); }
}

/* ------------------ CARD ------------------ */
.card {
  background: #444;
  padding: 20px;
  margin: 15px auto;
  max-width: 850px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.preview {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 8px;
  border: 2px solid black;
  background: white;
  cursor: pointer;
}

.button-column {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* ------------------ PULSANTI VERDI ------------------ */
.card button {
  background: green;
  color: white;
  border: none;
  padding: 16px 28px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 22px;
  font-weight: 700;
  width: 220px;
}

.card button:hover {
  background: #0a0;
}

/* ------------------ LOADER OVERLAY (LDR-A) ------------------ */
#loader-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.75);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 99999;
}

.loader-circle {
  border: 8px solid #444;
  border-top: 8px solid #fff;
  border-radius: 50%;
  width: 70px;
  height: 70px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loader-text {
  margin-top: 20px;
  font-size: 22px;
  color: white;
}

/* ------------------ ERRORE (ERR-A) ------------------ */
#error-box {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #900;
  padding: 20px 30px;
  border-radius: 10px;
  color: white;
  font-size: 22px;
  display: none;
  z-index: 100000;
}
</style>
</head>

<body>

<a class="back-button" href="index.html">⬅ Torna Indietro</a>

<h1 id="titolo"></h1>

<!-- LOADER OVERLAY -->
<div id="loader-overlay">
  <div class="loader-circle"></div>
  <div class="loader-text">Caricamento in corso…</div>
</div>

<!-- ERRORE -->
<div id="error-box">Caricamento non riuscito. Riprovare.</div>

<!-- ------------------ BLOCCO ALTO ------------------ -->
<div id="big-gallery">

    <div id="viewer-container">
        <div id="fullscreen-btn">⛶</div>
        <img id="big-image" src="">
        <video id="big-video" controls muted></video>
    </div>

    <div id="mute-btn">🔇</div>

    <div id="command-row">
        <span id="prev-btn">⬅️</span>
        <span id="slideshow-btn">▶️</span>
        <span id="next-btn">➡️</span>
    </div>

    <input id="speed-control" type="range" min="1" max="8" value="2">

    <div id="counter">0 / 0</div>
</div>

<!-- ------------------ BLOCCO BASSO ------------------ -->
<div id="pdf-container"></div>
<div id="bottom-spacer"></div>

<script>
const params = new URLSearchParams(window.location.search);
const cartella = params.get("cartella");

document.getElementById("titolo").innerHTML =
    "File in: " + cartella + "<br>Galleria + PDF/Immagini/Video";

let gallery = [];
let currentIndex = 0;
let firstImageIndex = 0;

let slideshowActive = false;
let slideshowTimer = null;

let transitionTime = 2000;

function getPause() {
  return document.getElementById("speed-control").value * 500;
}

/* ------------------ LOADER ------------------ */
function showLoader() {
  document.getElementById("loader-overlay").style.display = "flex";
}

function hideLoader() {
  document.getElementById("loader-overlay").style.display = "none";
}

/* ------------------ ERRORE ------------------ */
function showError() {
  const box = document.getElementById("error-box");
  box.style.display = "block";
  setTimeout(() => box.style.display = "none", 3000);
}

/* ------------------ FETCH FILES ------------------ */
fetch("elenco.json")
  .then(r => r.json())
  .then(data => {
    const files = data[cartella];
    const container = document.getElementById("pdf-container");

    const imageExt = [".jpg", ".jpeg", ".png", ".gif", ".webp"];
    let videoFound = null;

    files.forEach(file => {
      const encodedName = encodeURIComponent(file);
      const encodedFolder = encodeURIComponent(cartella);

      const base = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, "/");
      const directUrl = `${base}pdf/${encodedFolder}/${encodedName}`;

      const isPdf = file.toLowerCase().endsWith(".pdf");
      const isImage = imageExt.some(ext => file.toLowerCase().endsWith(ext));
      const isVideo = file.toLowerCase().endsWith(".mp4");

      if (isVideo) videoFound = { type: "video", url: directUrl };
      if (isImage) gallery.push({ type: "image", url: directUrl });

      const card = document.createElement("div");
      card.className = "card";

      let previewHtml = "";
      if (isImage)
        previewHtml = `<img class="preview" src="${directUrl}" onclick="openFromThumbnail('${directUrl}')">`;
      else if (isVideo)
        previewHtml = `<img class="preview" src="https://upload.wikimedia.org/wikipedia/commons/7/75/Video_icon.png" onclick="openFromThumbnail('${directUrl}')">`;
      else
        previewHtml = `<img class="preview" src="https://upload.wikimedia.org/wikipedia/commons/8/87/PDF_file_icon.svg" onclick="openFromThumbnail('${directUrl}')">`;

      /* ------------------ PULSANTI PER TIPO ------------------ */
      let buttons = "";

      if (isImage) {
        buttons = `<button onclick="window.open('${directUrl}')">Visualizza immagine</button>`;
      }
      else if (isPdf) {
        buttons = `
          <button onclick="window.location.href='${directUrl}'">Apri / Scarica</button>
          <button onclick="openPdfSafe('${directUrl}')">Vedi Online</button>
        `;
      }
      else if (isVideo) {
        buttons = `<button onclick="openVideo('${directUrl}')">Apri</button>`;
      }

      card.innerHTML = `
        ${previewHtml}
        <div class="card-title">${file}</div>
        <div class="button-column">${buttons}</div>
      `;

      container.appendChild(card);
    });

    if (videoFound) gallery.unshift(videoFound);

    firstImageIndex = (gallery[0].type === "video") ? 1 : 0;

    showItem(0, false);
  });

/* ------------------ VIDEO APERTURA IMMEDIATA ------------------ */
function openVideo(url) {
  window.location.href = url;
}

/* ------------------ PDF VIEWER SICURO COMPLETO ------------------ */
function openPdfSafe(url) {

  showLoader();

  let opened = false;

  // 1) Primo tentativo immediato
  try {
    const win = window.open(url, "_blank");
    if (win) opened = true;
  } catch(e){}

  // 2) Dopo 7 secondi → secondo tentativo
  setTimeout(() => {
    if (!opened) {
      try {
        window.location.href = url;
        opened = true;
      } catch(e){}
    }
  }, 7000);

  // 3) Dopo 9 secondi → iframe invisibile
  setTimeout(() => {
    if (!opened) {
      try {
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = url;
        document.body.appendChild(iframe);
        opened = true;
      } catch(e){}
    }
  }, 9000);

  // 4) Dopo 11 secondi → errore
  setTimeout(() => {
    hideLoader();
    if (!opened) showError();
  }, 11000);
}

/* ------------------ MINIATURA → VIEWER ------------------ */
function openFromThumbnail(url) {
  const index = gallery.findIndex(item => item.url === url);
  if (index !== -1) {
    stopSlideshow();
    showItem(index, false);
  }
}

/* ------------------ MOSTRA ELEMENTO ------------------ */
function showItem(index, animate = false) {
  currentIndex = index;

  const item = gallery[index];
  const img = document.getElementById("big-image");
  const vid = document.getElementById("big-video");
  const muteBtn = document.getElementById("mute-btn");

  img.style.display = "none";
  vid.style.display = "none";
  muteBtn.style.display = "none";

  img.classList.remove("bubble");
  vid.classList.remove("bubble");

  if (item.type === "image") {
    img.src = item.url;
    img.style.display = "block";

    if (animate) {
      img.classList.remove("bubble");
      void img.offsetWidth;
      img.classList.add("bubble");
    }

  } else {
    vid.src = item.url;
    vid.currentTime = 0;
    vid.muted = true;
    vid.play();
    vid.style.display = "block";

    if (animate) {
      vid.classList.remove("bubble");
      void vid.offsetWidth;
      vid.classList.add("bubble");
    }

    muteBtn.style.display = "block";
    muteBtn.textContent = "🔇";
  }

  document.getElementById("counter").textContent =
      `${index} / ${gallery.length - 1}`;
}

/* ------------------ NAVIGAZIONE ------------------ */
function goPrev() {
  stopSlideshow();
  if (currentIndex > 0) {
      currentIndex--;
      showItem(currentIndex, false);
  }
}

function goNext() {
  stopSlideshow();
  if (currentIndex < gallery.length - 1) {
      currentIndex++;
      showItem(currentIndex, false);
  }
}

document.getElementById("prev-btn").onclick = goPrev;
document.getElementById("next-btn").onclick = goNext;

/* ------------------ MUTE ------------------ */
document.getElementById("mute-btn").onclick = () => {
  const vid = document.getElementById("big-video");
  vid.muted = !vid.muted;
  document.getElementById("mute-btn").textContent = vid.muted ? "🔇" : "🔊";
};

/* ------------------ SLIDESHOW ------------------ */
function startSlideshow() {
  slideshowActive = true;
  document.getElementById("slideshow-btn").textContent = "⏸️";

  if (currentIndex === 0 || currentIndex >= gallery.length - 1) {
      currentIndex = firstImageIndex;
      showItem(currentIndex, true);
  }

  slideshowTimer = setInterval(() => {

    if (gallery[currentIndex].type === "video") {
        currentIndex = firstImageIndex;
        showItem(currentIndex, true);
        return;
    }

    if (currentIndex < gallery.length - 1) {
        currentIndex++;
        showItem(currentIndex, true);
    } 
    else {
        stopSlideshow();
        currentIndex = firstImageIndex;
        showItem(currentIndex, false);
    }

  }, getPause() + transitionTime);
}

function stopSlideshow() {
  slideshowActive = false;
  document.getElementById("slideshow-btn").textContent = "▶️";
  clearInterval(slideshowTimer);
}

document.getElementById("slideshow-btn").onclick = () => {
  if (slideshowActive) stopSlideshow();
  else startSlideshow();
};

/* ------------------ FULLSCREEN ------------------ */
document.getElementById("fullscreen-btn").onclick = () => {
  const elem = document.getElementById("big-gallery");
  if (!document.fullscreenElement) elem.requestFullscreen();
  else document.exitFullscreen();
};
</script>

</body>
</html>
