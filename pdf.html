<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>File della Cartella</title>

<style>
body {
  font-family: Arial;
  background: black;
  padding: 40px;
  color: white;
}

/* ------------------ TITOLO ------------------ */
h1 {
  text-align: center;
  color: red;
  font-size: 26px;
  margin-bottom: 40px;
}

/* ------------------ TORNA INDIETRO ------------------ */
.back-button {
    position: fixed;
    top: 15px;
    right: 15px;
    background-color: #0275d8;
    color: white;
    padding: 20px 28px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    font-size: 26px;
    z-index: 999;
}

/* ------------------ GALLERIA GRANDE ------------------ */
#big-gallery {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto 40px auto;
  text-align: center;
  position: relative;
}

#viewer-container {
  width: 100%;
  max-height: 70vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}

#big-image,
#big-video {
  max-width: 100%;
  max-height: 70vh;
  object-fit: contain;
  display: none;
}

/* ------------------ FULLSCREEN BUTTON ------------------ */
#fullscreen-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 42px;
  cursor: pointer;
  z-index: 20;
}

/* ------------------ MUTE ICON ------------------ */
#mute-btn {
  font-size: 38px;
  cursor: pointer;
  margin-top: 10px;
  display: none;
  text-align: right;
  padding-right: 20px;
}

/* ------------------ FRECCE GRANDI ------------------ */
#nav-buttons {
  margin-top: 20px;
  font-size: 60px;
  display: flex;
  justify-content: center;
  gap: 80px;
  cursor: pointer;
}

#nav-buttons span {
  user-select: none;
}

/* ------------------ INDICATORE ------------------ */
#counter {
  margin-top: 10px;
  font-size: 24px;
  color: #ccc;
}

/* ------------------ SLIDESHOW BUTTON ------------------ */
#slideshow-btn {
  margin-top: 25px;
  font-size: 90px;
  cursor: pointer;
}

/* ------------------ SLIDER VELOCITÀ ------------------ */
#speed-control {
  margin-top: 20px;
  width: 60%;
}

/* ------------------ EFFETTO BOLLA Z3 + EASING B2 ------------------ */
.bubble {
  animation: bubbleZoom 2s cubic-bezier(.34,1.56,.64,1) forwards;
}

@keyframes bubbleZoom {
  0%   { opacity: 0; transform: scale(0.3); }
  100% { opacity: 1; transform: scale(1); }
}

/* ------------------ CARD SOTTO ------------------ */
.card {
  background: #444;
  padding: 20px;
  margin: 15px auto;
  max-width: 850px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.preview {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 8px;
  border: 2px solid black;
  background: white;
}

.button-column {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card button {
  background: #666;
  color: white;
  border: none;
  padding: 16px 28px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 22px;
  font-weight: 700;
  width: 220px;
}

.card button:hover {
  background: #777;
}

/* Loader */
.loader {
  color: white;
  font-size: 18px;
  margin-top: 10px;
}
</style>
</head>

<body>

<a class="back-button" href="index.html">⬅ Torna Indietro</a>

<h1 id="titolo"></h1>

<!-- ------------------ GALLERIA GRANDE ------------------ -->
<div id="big-gallery">

    <div id="viewer-container">
        <div id="fullscreen-btn">⛶</div>
        <img id="big-image" src="">
        <video id="big-video" controls muted></video>
    </div>

    <div id="mute-btn">🔇</div>

    <div id="nav-buttons">
        <span id="prev-btn">⬅️</span>
        <span id="next-btn">➡️</span>
    </div>

    <div id="slideshow-btn">▶️</div>

    <input id="speed-control" type="range" min="1" max="8" value="2">

    <div id="counter">0 / 0</div>
</div>

<!-- ------------------ LISTA FILE SOTTO ------------------ -->
<div id="pdf-container"></div>

<script>
const params = new URLSearchParams(window.location.search);
const cartella = params.get("cartella");

document.getElementById("titolo").innerHTML =
    "File in: " + cartella + "<br>Galleria + PDF/Immagini/Video";

let gallery = [];
let currentIndex = 0;
let firstImageIndex = 0;

let slideshowActive = false;
let slideshowTimer = null;

let transitionTime = 2000; // 2 secondi

function getPause() {
  return document.getElementById("speed-control").value * 500; // 0.5s → 4s
}

fetch("elenco.json")
  .then(r => r.json())
  .then(data => {
    const files = data[cartella];
    const container = document.getElementById("pdf-container");

    const imageExt = [".jpg", ".jpeg", ".png", ".gif", ".webp"];
    let videoFound = null;

    files.forEach(file => {
      const encodedName = encodeURIComponent(file);
      const encodedFolder = encodeURIComponent(cartella);

      const base = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, "/");
      const directUrl = `${base}pdf/${encodedFolder}/${encodedName}`;

      const isPdf = file.toLowerCase().endsWith(".pdf");
      const isImage = imageExt.some(ext => file.toLowerCase().endsWith(ext));
      const isVideo = file.toLowerCase().endsWith(".mp4");

      if (isVideo) videoFound = { type: "video", url: directUrl };
      if (isImage) gallery.push({ type: "image", url: directUrl });

      const card = document.createElement("div");
      card.className = "card";

      let previewHtml = "";
      if (isImage) previewHtml = `<img class="preview" src="${directUrl}">`;
      else if (isVideo) previewHtml = `<img class="preview" src="https://upload.wikimedia.org/wikipedia/commons/7/75/Video_icon.png">`;
      else previewHtml = `<img class="preview" src="https://upload.wikimedia.org/wikipedia/commons/8/87/PDF_file_icon.svg">`;

      /* ------------------ PULSANTI ------------------ */
      let buttons = `
        <button onclick="window.open('${directUrl}')">Apri / Scarica</button>
        <button onclick="openOnline('${directUrl}', '${file}')">Vedi Online</button>
      `;

      card.innerHTML = `
        ${previewHtml}
        <div class="card-title">${file}</div>
        <div class="button-column">${buttons}</div>
      `;

      container.appendChild(card);
    });

    if (videoFound) gallery.unshift(videoFound);

    firstImageIndex = (gallery[0].type === "video") ? 1 : 0;

    showItem(0, false); // MOSTRA VIDEO SE ESISTE
  });

/* ------------------ FUNZIONE VEDI ONLINE ------------------ */
function openOnline(url, filename) {
  const ext = filename.toLowerCase();

  let loader = document.createElement("div");
  loader.className = "loader";
  loader.innerText = "Caricamento in corso...";
  document.body.appendChild(loader);

  setTimeout(() => {
    loader.remove();

    if (ext.endsWith(".pdf")) {
      window.open(url, "_blank");
    }
    else if (ext.endsWith(".mp4")) {
      window.open(url, "_blank");
    }
    else {
      window.open(url, "_blank");
    }

  }, 800);
}

/* ------------------ MOSTRA ELEMENTO ------------------ */
function showItem(index, animate = false) {
  currentIndex = index;

  const item = gallery[index];
  const img = document.getElementById("big-image");
  const vid = document.getElementById("big-video");
  const muteBtn = document.getElementById("mute-btn");

  img.style.display = "none";
  vid.style.display = "none";
  muteBtn.style.display = "none";

  img.classList.remove("bubble");
  vid.classList.remove("bubble");

  if (item.type === "image") {
    img.src = item.url;
    img.style.display = "block";

    if (animate) {
      img.classList.remove("bubble");
      void img.offsetWidth;
      img.classList.add("bubble");
    }

  } else {
    vid.src = item.url;
    vid.currentTime = 0;
    vid.muted = true;
    vid.play();
    vid.style.display = "block";

    if (animate) {
      vid.classList.remove("bubble");
      void vid.offsetWidth;
      vid.classList.add("bubble");
    }

    muteBtn.style.display = "block";
    muteBtn.textContent = "🔇";
  }

  document.getElementById("counter").textContent =
      `${index} / ${gallery.length - 1}`;
}

/* ------------------ NAVIGAZIONE ------------------ */
function goPrev() {
  stopSlideshow();

  if (currentIndex > 0) {
      currentIndex--;
      showItem(currentIndex, false);
  }
}

function goNext() {
  stopSlideshow();

  if (currentIndex < gallery.length - 1) {
      currentIndex++;
      showItem(currentIndex, false);
  }
}

document.getElementById("prev-btn").onclick = goPrev;
document.getElementById("next-btn").onclick = goNext;

/* ------------------ MUTE ------------------ */
document.getElementById("mute-btn").onclick = () => {
  const vid = document.getElementById("big-video");
  vid.muted = !vid.muted;
  document.getElementById("mute-btn").textContent = vid.muted ? "🔇" : "🔊";
};

/* ------------------ SLIDESHOW ------------------ */
function startSlideshow() {
  slideshowActive = true;
  document.getElementById("slideshow-btn").textContent = "⏸️";

  if (currentIndex === 0 || currentIndex >= gallery.length - 1) {
      currentIndex = firstImageIndex;
      showItem(currentIndex, true);
  }

  slideshowTimer = setInterval(() => {

    if (gallery[currentIndex].type === "video") {
        currentIndex = firstImageIndex;
        showItem(currentIndex, true);
        return;
    }

    if (currentIndex < gallery.length - 1) {
        currentIndex++;
        showItem(currentIndex, true);
    } 
    else {
        stopSlideshow();
        currentIndex = firstImageIndex;
        showItem(currentIndex, false);
    }

  }, getPause() + transitionTime);
}

function stopSlideshow() {
  slideshowActive = false;
  document.getElementById("slideshow-btn").textContent = "▶️";
  clearInterval(slideshowTimer);
}

document.getElementById("slideshow-btn").onclick = () => {
  if (slideshowActive) stopSlideshow();
  else startSlideshow();
};

/* ------------------ FULLSCREEN ------------------ */
document.getElementById("fullscreen-btn").onclick = () => {
  const elem = document.getElementById("big-gallery");
  if (!document.fullscreenElement) elem.requestFullscreen();
  else document.exitFullscreen();
};
</script>

</body>
</html>
